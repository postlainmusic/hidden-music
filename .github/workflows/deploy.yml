name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.idea/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    env:
      npm_config_legacy_peer_deps: "true"
      npm_config_audit: "false"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node Modules & Build Tools
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json', '**/package.json') }}-v2
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Next.js & Vercel Artifacts
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .vercel/cache
          key: ${{ runner.os }}-nextjs-incremental-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-incremental-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies & Build tools
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          npm install --prefer-offline
          npm install -D @cloudflare/next-on-pages vercel wrangler

      - name: Build Next.js with Cloudflare Adapter
        run: npx @cloudflare/next-on-pages

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .vercel/output/static --project-name=hidden-music --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
