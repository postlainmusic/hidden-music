name: Build Native Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Music Player APK with Native Playbar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Convert SVG to Native Android Icons
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

          mkdir -p native-app/app/src/main/res/mipmap-mdpi
          mkdir -p native-app/app/src/main/res/mipmap-hdpi
          mkdir -p native-app/app/src/main/res/mipmap-xhdpi
          mkdir -p native-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p native-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p native-app/app/src/main/res/drawable

          rsvg-convert -w 48 -h 48 src/app/icon.svg -o native-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 src/app/icon.svg -o native-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 src/app/icon.svg -o native-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 src/app/icon.svg -o native-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 src/app/icon.svg -o native-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 src/app/icon.svg -o native-app/app/src/main/res/drawable/ic_music_note.png

      - name: Scaffold Music Player App with Native Notification Bridge
        run: |
          mkdir -p native-app/app/src/main/java/com/postlain/hiddenmusic
          mkdir -p native-app/app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > native-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HiddenMusicApp"
          include ':app'
          EOF

          # 2. gradle.properties
          cat << 'EOF' > native-app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dhttp.agent=Mozilla/5.0
          android.useAndroidX=true
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > native-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 4. App build.gradle
          cat << 'EOF' > native-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.postlain.hiddenmusic'
              compileSdk 34

              defaultConfig {
                  applicationId "com.postlain.hiddenmusic"
                  minSdk 24
                  targetSdk 34
                  versionCode 6
                  versionName "1.5.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      applicationIdSuffix ""
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
              implementation 'androidx.media:media:1.7.0'
              implementation 'androidx.core:core:1.12.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > native-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Hidden Music"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:hardwareAccelerated="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".MediaNotificationReceiver" android:exported="false" />
              </application>
          </manifest>
          EOF

          # 6. Strings resource
          cat << 'EOF' > native-app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Hidden Music</string>
          </resources>
          EOF

          # 7. MediaNotificationReceiver.java (Nhận nút bấm từ Notification)
          cat << 'EOF' > native-app/app/src/main/java/com/postlain/hiddenmusic/MediaNotificationReceiver.java
          package com.postlain.hiddenmusic;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class MediaNotificationReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  String action = intent.getAction();
                  if (action != null && MainActivity.instance != null) {
                      MainActivity.instance.handleMediaAction(action);
                  }
              }
          }
          EOF

          # 8. MainActivity.java (Cầu nối Bridge và hiển thị Notification)
          cat << 'EOF' > native-app/app/src/main/java/com/postlain/hiddenmusic/MainActivity.java
          package com.postlain.hiddenmusic;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.http.SslError;
          import android.os.Build;
          import android.os.Bundle;
          import android.support.v4.media.session.MediaSessionCompat;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends AppCompatActivity {
              public static MainActivity instance;
              private WebView webView;
              private MediaSessionCompat mediaSession;
              private NotificationManager notificationManager;
              private static final String CHANNEL_ID = "hidden_music_playback";
              private static final int NOTIFICATION_ID = 1001;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  instance = this;

                  createNotificationChannel();
                  mediaSession = new MediaSessionCompat(this, "HiddenMusicMediaSession");
                  mediaSession.setActive(true);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                  );

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  webView.setScrollBarStyle(View.SCROLLBARS_INSIDE_OVERLAY);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setRenderPriority(WebSettings.RenderPriority.HIGH);
                  settings.setOffscreenPreRaster(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.addJavascriptInterface(new WebAppInterface(), "AndroidMediaBridge");

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.proceed();
                      }
                  });

                  webView.loadUrl("https://hiddenmusic.postlain.com");
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Music Playback",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("Hidden Music Vault Player Controls");
                      channel.setShowBadge(false);
                      channel.setSound(null, null);
                      notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (notificationManager != null) {
                          notificationManager.createNotificationChannel(channel);
                      }
                  } else {
                      notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  }
              }

              public void handleMediaAction(String action) {
                  runOnUiThread(() -> {
                      if (webView != null) {
                          webView.evaluateJavascript("if (window.__vault_media_action) window.__vault_media_action('" + action + "');", null);
                      }
                  });
              }

              public void updateNotification(String title, String artist, String coverUrl, boolean isPlaying) {
                  new Thread(() -> {
                      Bitmap albumArt = null;
                      try {
                          if (coverUrl != null && coverUrl.startsWith("http")) {
                              URL url = new URL(coverUrl);
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.setDoInput(true);
                              conn.connect();
                              InputStream is = conn.getInputStream();
                              albumArt = BitmapFactory.decodeStream(is);
                          }
                      } catch (Exception ignored) {}

                      if (albumArt == null) {
                          albumArt = BitmapFactory.decodeResource(getResources(), R.drawable.ic_music_note);
                      }

                      Intent mainIntent = new Intent(this, MainActivity.class);
                      PendingIntent contentIntent = PendingIntent.getActivity(this, 0, mainIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                      PendingIntent prevIntent = PendingIntent.getBroadcast(this, 1, new Intent(this, MediaNotificationReceiver.class).setAction("PREV"), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      PendingIntent playIntent = PendingIntent.getBroadcast(this, 2, new Intent(this, MediaNotificationReceiver.class).setAction("PLAY_PAUSE"), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      PendingIntent nextIntent = PendingIntent.getBroadcast(this, 3, new Intent(this, MediaNotificationReceiver.class).setAction("NEXT"), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                      NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(R.drawable.ic_music_note)
                          .setLargeIcon(albumArt)
                          .setContentTitle(title)
                          .setContentText(artist)
                          .setContentIntent(contentIntent)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setOngoing(isPlaying)
                          .setSilent(true)
                          .addAction(android.R.drawable.ic_media_previous, "Previous", prevIntent)
                          .addAction(isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play, isPlaying ? "Pause" : "Play", playIntent)
                          .addAction(android.R.drawable.ic_media_next, "Next", nextIntent)
                          .setStyle(new androidx.media.app.NotificationCompat.MediaStyle()
                              .setMediaSession(mediaSession.getSessionToken())
                              .setShowActionsInCompactView(0, 1, 2));

                      if (notificationManager != null) {
                          notificationManager.notify(NOTIFICATION_ID, builder.build());
                      }
                  }).start();
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void updateMedia(String title, String artist, String coverUrl, boolean isPlaying) {
                      updateNotification(title, artist, coverUrl, isPlaying);
                  }

                  @JavascriptInterface
                  public void clearMedia() {
                      if (notificationManager != null) {
                          notificationManager.cancel(NOTIFICATION_ID);
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK via Gradle 8.5
        run: |
          cd native-app
          gradle assembleDebug --no-daemon

      - name: Prepare APK Binary
        run: |
          cp native-app/app/build/outputs/apk/debug/app-debug.apk ./hidden-music.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HiddenMusic-Native-APK
          path: ./hidden-music.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Hidden Music Vault Android (Latest)"
          body: |
            ## 🎵 Hidden Music Vault - Native Android APK with System Media Notification
            Bản build hỗ trợ thanh phát nhạc Playbar Native trên Notification và Màn hình khóa Android.
          draft: false
          prerelease: false
          files: ./hidden-music.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
