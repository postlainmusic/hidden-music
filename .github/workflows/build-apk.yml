name: Build Native Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Ultra Native Music Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Convert SVG to Native Android Icons
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

          mkdir -p native-app/app/src/main/res/mipmap-mdpi
          mkdir -p native-app/app/src/main/res/mipmap-hdpi
          mkdir -p native-app/app/src/main/res/mipmap-xhdpi
          mkdir -p native-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p native-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p native-app/app/src/main/res/drawable
          mkdir -p native-app/app/src/main/res/xml
          mkdir -p native-app/app/src/main/res/layout
          mkdir -p native-app/app/src/main/res/values

          rsvg-convert -w 48 -h 48 src/app/icon.svg -o native-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 src/app/icon.svg -o native-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 src/app/icon.svg -o native-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 src/app/icon.svg -o native-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 src/app/icon.svg -o native-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 src/app/icon.svg -o native-app/app/src/main/res/drawable/ic_music_note.png

      - name: Scaffold Native App with Premium Widgets and MediaSession
        run: |
          mkdir -p native-app/app/src/main/java/com/postlain/hiddenmusic

          # 1. settings.gradle
          cat << 'EOF' > native-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HiddenMusicApp"
          include ':app'
          EOF

          # 2. gradle.properties
          cat << 'EOF' > native-app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dhttp.agent=Mozilla/5.0
          android.useAndroidX=true
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > native-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 4. App build.gradle
          cat << 'EOF' > native-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.postlain.hiddenmusic'
              compileSdk 34

              defaultConfig {
                  applicationId "com.postlain.hiddenmusic"
                  minSdk 24
                  targetSdk 34
                  versionCode 8
                  versionName "2.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      applicationIdSuffix ""
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
              implementation 'androidx.media:media:1.7.0'
              implementation 'androidx.core:core:1.12.0'
              implementation 'androidx.palette:palette:1.0.0'
          }
          EOF

          # 5. Strings & Colors
          cat << 'EOF' > native-app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Hidden Music</string>
              <string name="widget_mini_name">Hidden Music (Mini Player)</string>
              <string name="widget_expanded_name">Hidden Music (Full Player)</string>
          </resources>
          EOF

          cat << 'EOF' > native-app/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="widget_bg">#121218</color>
              <color name="widget_text_primary">#FFFFFF</color>
              <color name="widget_text_secondary">#9CA3AF</color>
          </resources>
          EOF

          # 6. Widget Provider Info XMLs
          cat << 'EOF' > native-app/app/src/main/res/xml/widget_mini_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="140dp"
              android:minHeight="140dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget_mini"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > native-app/app/src/main/res/xml/widget_expanded_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="280dp"
              android:minHeight="110dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget_expanded"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          # 7. Widget Background Drawable (Glassmorphic)
          cat << 'EOF' > native-app/app/src/main/res/drawable/widget_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#F0101014" />
              <corners android:radius="24dp" />
              <stroke android:width="1dp" android:color="#25FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > native-app/app/src/main/res/drawable/artwork_rounded.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#1F1F24" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          # 8. Widget Layouts (Glassmorphism & High-end UI)
          cat << 'EOF' > native-app/app/src/main/res/layout/widget_mini.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_mini_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_background"
              android:padding="12dp">

              <ImageView
                  android:id="@+id/widget_artwork"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="centerCrop"
                  android:background="@drawable/artwork_rounded"
                  android:clipToOutline="true"
                  android:src="@drawable/ic_music_note" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:background="#D0000000"
                  android:padding="8dp">

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/widget_title"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Hidden Music"
                          android:textColor="#FFFFFF"
                          android:textSize="12sp"
                          android:textStyle="bold"
                          android:maxLines="1"
                          android:ellipsize="end" />

                      <TextView
                          android:id="@+id/widget_artist"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="PostLain Vault"
                          android:textColor="#9CA3AF"
                          android:textSize="10sp"
                          android:maxLines="1"
                          android:ellipsize="end" />
                  </LinearLayout>

                  <ImageView
                      android:id="@+id/widget_btn_play_pause"
                      android:layout_width="28dp"
                      android:layout_height="28dp"
                      android:src="@android:drawable/ic_media_play"
                      android:tint="#FFFFFF"
                      android:padding="4dp" />
              </LinearLayout>
          </RelativeLayout>
          EOF

          cat << 'EOF' > native-app/app/src/main/res/layout/widget_expanded.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_expanded_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_background"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:padding="12dp">

              <ImageView
                  android:id="@+id/widget_artwork"
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:scaleType="centerCrop"
                  android:background="@drawable/artwork_rounded"
                  android:clipToOutline="true"
                  android:src="@drawable/ic_music_note" />

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:layout_marginStart="14dp"
                  android:layout_marginEnd="6dp">

                  <TextView
                      android:id="@+id/widget_title"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Hidden Music Vault"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:textStyle="bold"
                      android:maxLines="1"
                      android:ellipsize="end" />

                  <TextView
                      android:id="@+id/widget_artist"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="PostLain"
                      android:textColor="#9CA3AF"
                      android:textSize="11sp"
                      android:layout_marginTop="2dp"
                      android:maxLines="1"
                      android:ellipsize="end" />

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:layout_marginTop="8dp">

                      <ImageView
                          android:id="@+id/widget_btn_prev"
                          android:layout_width="32dp"
                          android:layout_height="32dp"
                          android:src="@android:drawable/ic_media_previous"
                          android:tint="#FFFFFF"
                          android:padding="6dp" />

                      <ImageView
                          android:id="@+id/widget_btn_play_pause"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_marginStart="8dp"
                          android:layout_marginEnd="8dp"
                          android:src="@android:drawable/ic_media_play"
                          android:tint="#FFFFFF"
                          android:padding="6dp" />

                      <ImageView
                          android:id="@+id/widget_btn_next"
                          android:layout_width="32dp"
                          android:layout_height="32dp"
                          android:src="@android:drawable/ic_media_next"
                          android:tint="#FFFFFF"
                          android:padding="6dp" />
                  </LinearLayout>
              </LinearLayout>
          </LinearLayout>
          EOF

          # 9. AndroidManifest.xml (Đầy đủ Quyền & Cấu hình 2 Widgets)
          cat << 'EOF' > native-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Hidden Music"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:hardwareAccelerated="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Widget 1: Mini 2x2 -->
                  <receiver
                      android:name=".MusicMiniWidgetProvider"
                      android:exported="true"
                      android:label="@string/widget_mini_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_mini_info" />
                  </receiver>

                  <!-- Widget 2: Full Expanded 4x2 -->
                  <receiver
                      android:name=".MusicExpandedWidgetProvider"
                      android:exported="true"
                      android:label="@string/widget_expanded_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_expanded_info" />
                  </receiver>

                  <receiver android:name=".MediaNotificationReceiver" android:exported="false" />
              </application>
          </manifest>
          EOF

          # 10. Java Backend Core (MediaNotificationReceiver, WidgetProviders, MainActivity)
          cat << 'EOF' > native-app/app/src/main/java/com/postlain/hiddenmusic/MediaNotificationReceiver.java
          package com.postlain.hiddenmusic;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class MediaNotificationReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  String action = intent.getAction();
                  if (action != null && MainActivity.instance != null) {
                      MainActivity.instance.handleMediaAction(action);
                  }
              }
          }
          EOF

          cat << 'EOF' > native-app/app/src/main/java/com/postlain/hiddenmusic/MusicMiniWidgetProvider.java
          package com.postlain.hiddenmusic;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.widget.RemoteViews;

          public class MusicMiniWidgetProvider extends AppWidgetProvider {
              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  updateAll(context, appWidgetManager, appWidgetIds, null, null, null, false);
              }

              public static void updateAll(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds,
                                           String title, String artist, Bitmap artwork, boolean isPlaying) {
                  for (int appWidgetId : appWidgetIds) {
                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_mini);

                      if (title != null) views.setTextViewText(R.id.widget_title, title);
                      if (artist != null) views.setTextViewText(R.id.widget_artist, artist);
                      if (artwork != null) {
                          views.setImageViewBitmap(R.id.widget_artwork, artwork);
                      }

                      views.setImageViewResource(R.id.widget_btn_play_pause,
                              isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play);

                      Intent mainIntent = new Intent(context, MainActivity.class);
                      PendingIntent mainPi = PendingIntent.getActivity(context, 10, mainIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      views.setOnClickPendingIntent(R.id.widget_mini_root, mainPi);

                      Intent playIntent = new Intent(context, MediaNotificationReceiver.class).setAction("PLAY_PAUSE");
                      PendingIntent playPi = PendingIntent.getBroadcast(context, 11, playIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      views.setOnClickPendingIntent(R.id.widget_btn_play_pause, playPi);

                      appWidgetManager.updateAppWidget(appWidgetId, views);
                  }
              }
          }
          EOF

          cat << 'EOF' > native-app/app/src/main/java/com/postlain/hiddenmusic/MusicExpandedWidgetProvider.java
          package com.postlain.hiddenmusic;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.widget.RemoteViews;

          public class MusicExpandedWidgetProvider extends AppWidgetProvider {
              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  updateAll(context, appWidgetManager, appWidgetIds, null, null, null, false);
              }

              public static void updateAll(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds,
                                           String title, String artist, Bitmap artwork, boolean isPlaying) {
                  for (int appWidgetId : appWidgetIds) {
                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_expanded);

                      if (title != null) views.setTextViewText(R.id.widget_title, title);
                      if (artist != null) views.setTextViewText(R.id.widget_artist, artist);
                      if (artwork != null) {
                          views.setImageViewBitmap(R.id.widget_artwork, artwork);
                      }

                      views.setImageViewResource(R.id.widget_btn_play_pause,
                              isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play);

                      Intent mainIntent = new Intent(context, MainActivity.class);
                      PendingIntent mainPi = PendingIntent.getActivity(context, 20, mainIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      views.setOnClickPendingIntent(R.id.widget_expanded_root, mainPi);

                      Intent prevIntent = new Intent(context, MediaNotificationReceiver.class).setAction("PREV");
                      PendingIntent prevPi = PendingIntent.getBroadcast(context, 21, prevIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      views.setOnClickPendingIntent(R.id.widget_btn_prev, prevPi);

                      Intent playIntent = new Intent(context, MediaNotificationReceiver.class).setAction("PLAY_PAUSE");
                      PendingIntent playPi = PendingIntent.getBroadcast(context, 22, playIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      views.setOnClickPendingIntent(R.id.widget_btn_play_pause, playPi);

                      Intent nextIntent = new Intent(context, MediaNotificationReceiver.class).setAction("NEXT");
                      PendingIntent nextPi = PendingIntent.getBroadcast(context, 23, nextIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      views.setOnClickPendingIntent(R.id.widget_btn_next, nextPi);

                      appWidgetManager.updateAppWidget(appWidgetId, views);
                  }
              }
          }
          EOF

          cat << 'EOF' > native-app/app/src/main/java/com/postlain/hiddenmusic/MainActivity.java
          package com.postlain.hiddenmusic;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.http.SslError;
          import android.os.Build;
          import android.os.Bundle;
          import android.support.v4.media.MediaMetadataCompat;
          import android.support.v4.media.session.MediaSessionCompat;
          import android.support.v4.media.session.PlaybackStateCompat;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends AppCompatActivity {
              public static MainActivity instance;
              private WebView webView;
              private MediaSessionCompat mediaSession;
              private NotificationManager notificationManager;
              private static final String CHANNEL_ID = "hidden_music_playback";
              private static final int NOTIFICATION_ID = 1001;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  instance = this;

                  createNotificationChannel();
                  setupMediaSession();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                  );

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  webView.setScrollBarStyle(View.SCROLLBARS_INSIDE_OVERLAY);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setRenderPriority(WebSettings.RenderPriority.HIGH);
                  settings.setOffscreenPreRaster(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.addJavascriptInterface(new WebAppInterface(), "AndroidMediaBridge");

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.proceed();
                      }
                  });

                  webView.loadUrl("https://hiddenmusic.postlain.com");
              }

              private void setupMediaSession() {
                  mediaSession = new MediaSessionCompat(this, "HiddenMusicMediaSession");
                  mediaSession.setCallback(new MediaSessionCompat.Callback() {
                      @Override
                      public void onPlay() {
                          handleMediaAction("PLAY_PAUSE");
                      }
                      @Override
                      public void onPause() {
                          handleMediaAction("PLAY_PAUSE");
                      }
                      @Override
                      public void onSkipToNext() {
                          handleMediaAction("NEXT");
                      }
                      @Override
                      public void onSkipToPrevious() {
                          handleMediaAction("PREV");
                      }
                      @Override
                      public void onSeekTo(long pos) {
                          runOnUiThread(() -> {
                              if (webView != null) {
                                  webView.evaluateJavascript("if (window.__vault_media_seek) window.__vault_media_seek(" + (pos / 1000f) + ");", null);
                              }
                          });
                      }
                  });
                  mediaSession.setActive(true);
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Music Playback",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("Hidden Music Vault Player Controls");
                      channel.setShowBadge(false);
                      channel.setSound(null, null);
                      notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (notificationManager != null) {
                          notificationManager.createNotificationChannel(channel);
                      }
                  } else {
                      notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  }
              }

              public void handleMediaAction(String action) {
                  runOnUiThread(() -> {
                      if (webView != null) {
                          webView.evaluateJavascript("if (window.__vault_media_action) window.__vault_media_action('" + action + "');", null);
                      }
                  });
              }

              public void updateFullPlayerState(String title, String artist, String album, String coverUrl, boolean isPlaying, long positionMs, long durationMs) {
                  new Thread(() -> {
                      Bitmap albumArt = null;
                      try {
                          if (coverUrl != null && coverUrl.startsWith("http")) {
                              URL url = new URL(coverUrl);
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.setDoInput(true);
                              conn.connect();
                              InputStream is = conn.getInputStream();
                              albumArt = BitmapFactory.decodeStream(is);
                          }
                      } catch (Exception ignored) {}

                      if (albumArt == null) {
                          albumArt = BitmapFactory.decodeResource(getResources(), R.drawable.ic_music_note);
                      }

                      // 1. Cập nhật MediaSession hệ thống (Tạo sóng âm, thanh seekbar live trên notification)
                      MediaMetadataCompat.Builder metaBuilder = new MediaMetadataCompat.Builder()
                          .putString(MediaMetadataCompat.METADATA_KEY_TITLE, title)
                          .putString(MediaMetadataCompat.METADATA_KEY_ARTIST, artist)
                          .putString(MediaMetadataCompat.METADATA_KEY_ALBUM, album)
                          .putBitmap(MediaMetadataCompat.METADATA_KEY_ALBUM_ART, albumArt)
                          .putLong(MediaMetadataCompat.METADATA_KEY_DURATION, durationMs);
                      mediaSession.setMetadata(metaBuilder.build());

                      long actions = PlaybackStateCompat.ACTION_PLAY | PlaybackStateCompat.ACTION_PAUSE |
                                     PlaybackStateCompat.ACTION_SKIP_TO_NEXT | PlaybackStateCompat.ACTION_SKIP_TO_PREVIOUS |
                                     PlaybackStateCompat.ACTION_SEEK_TO;

                      PlaybackStateCompat.Builder stateBuilder = new PlaybackStateCompat.Builder()
                          .setActions(actions)
                          .setState(isPlaying ? PlaybackStateCompat.STATE_PLAYING : PlaybackStateCompat.STATE_PAUSED,
                                    positionMs, 1.0f);
                      mediaSession.setPlaybackState(stateBuilder.build());

                      // 2. Cập nhật Notification MediaStyle
                      Intent mainIntent = new Intent(this, MainActivity.class);
                      PendingIntent contentIntent = PendingIntent.getActivity(this, 0, mainIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                      PendingIntent prevIntent = PendingIntent.getBroadcast(this, 1, new Intent(this, MediaNotificationReceiver.class).setAction("PREV"), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      PendingIntent playIntent = PendingIntent.getBroadcast(this, 2, new Intent(this, MediaNotificationReceiver.class).setAction("PLAY_PAUSE"), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      PendingIntent nextIntent = PendingIntent.getBroadcast(this, 3, new Intent(this, MediaNotificationReceiver.class).setAction("NEXT"), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                      NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(R.drawable.ic_music_note)
                          .setLargeIcon(albumArt)
                          .setContentTitle(title)
                          .setContentText(artist)
                          .setSubText(album)
                          .setContentIntent(contentIntent)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setOngoing(isPlaying)
                          .setSilent(true)
                          .addAction(android.R.drawable.ic_media_previous, "Previous", prevIntent)
                          .addAction(isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play, isPlaying ? "Pause" : "Play", playIntent)
                          .addAction(android.R.drawable.ic_media_next, "Next", nextIntent)
                          .setStyle(new androidx.media.app.NotificationCompat.MediaStyle()
                              .setMediaSession(mediaSession.getSessionToken())
                              .setShowActionsInCompactView(0, 1, 2));

                      if (notificationManager != null) {
                          notificationManager.notify(NOTIFICATION_ID, builder.build());
                      }

                      // 3. Cập nhật đồng thời cho 2 Widgets ngoài màn hình chính
                      AppWidgetManager appWidgetManager = AppWidgetManager.getInstance(this);

                      int[] miniIds = appWidgetManager.getAppWidgetIds(new ComponentName(this, MusicMiniWidgetProvider.class));
                      MusicMiniWidgetProvider.updateAll(this, appWidgetManager, miniIds, title, artist, albumArt, isPlaying);

                      int[] expIds = appWidgetManager.getAppWidgetIds(new ComponentName(this, MusicExpandedWidgetProvider.class));
                      MusicExpandedWidgetProvider.updateAll(this, appWidgetManager, expIds, title, artist, albumArt, isPlaying);

                  }).start();
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void updateMedia(String title, String artist, String album, String coverUrl, boolean isPlaying, double positionSec, double durationSec) {
                      long posMs = (long) (positionSec * 1000);
                      long durMs = (long) (durationSec * 1000);
                      updateFullPlayerState(title, artist, album, coverUrl, isPlaying, posMs, durMs);
                  }

                  @JavascriptInterface
                  public void clearMedia() {
                      if (notificationManager != null) {
                          notificationManager.cancel(NOTIFICATION_ID);
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK via Gradle 8.5
        run: |
          cd native-app
          gradle assembleDebug --no-daemon

      - name: Prepare APK Binary
        run: |
          cp native-app/app/build/outputs/apk/debug/app-debug.apk ./hidden-music.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HiddenMusic-FullNative-APK
          path: ./hidden-music.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Hidden Music Vault Android (Ultra Native)"
          body: |
            ## 🎵 Hidden Music Vault - Native Android APK v2.0
            - Tích hợp **MediaStyle Notification** chuẩn Android 13/14+ (Full Metadata, Artwork, Real-time Playback State).
            - Bổ sung **2 Home Screen Widgets** phong cách Apple Music / Spotify (Mini 2x2 & Full 4x2).
          draft: false
          prerelease: false
          files: ./hidden-music.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
