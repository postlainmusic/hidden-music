name: Build TWA Android APK & Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-twa:
    name: Build TWA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Keystore for Signing
        run: |
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=PostLain, OU=Music, O=HiddenMusic, L=DaLat, S=LamDong, C=VN"

      - name: Build TWA Project
        run: |
          bubblewrap build --manifest=twa-manifest.json --skipPwaValidation
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Prepare APK Binary
        run: |
          cp app-release-signed.apk ./hidden-music.apk || cp app-debug.apk ./hidden-music.apk || cp *.apk ./hidden-music.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HiddenMusic-TWA-Android-APK
          path: ./hidden-music.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Hidden Music Vault TWA Android (Latest)"
          body: |
            ## 🎵 Hidden Music Vault - Trusted Web Activity (TWA)
            
            Bản build Android chuẩn TWA của Google (sử dụng Chromium engine gốc, siêu nhẹ, không lỗi mạng).
          draft: false
          prerelease: false
          files: ./hidden-music.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
