name: Build Native Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Music Player APK with Media Playbar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Convert SVG to Native Android Icons
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

          mkdir -p native-app/app/src/main/res/mipmap-mdpi
          mkdir -p native-app/app/src/main/res/mipmap-hdpi
          mkdir -p native-app/app/src/main/res/mipmap-xhdpi
          mkdir -p native-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p native-app/app/src/main/res/mipmap-xxxhdpi

          rsvg-convert -w 48 -h 48 src/app/icon.svg -o native-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 src/app/icon.svg -o native-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 src/app/icon.svg -o native-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 src/app/icon.svg -o native-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 src/app/icon.svg -o native-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Scaffold Music Player App with MediaSession
        run: |
          mkdir -p native-app/app/src/main/java/com/postlain/hiddenmusic
          mkdir -p native-app/app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > native-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HiddenMusicApp"
          include ':app'
          EOF

          # 2. gradle.properties
          cat << 'EOF' > native-app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dhttp.agent=Mozilla/5.0
          android.useAndroidX=true
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > native-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 4. App build.gradle
          cat << 'EOF' > native-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.postlain.hiddenmusic'
              compileSdk 34

              defaultConfig {
                  applicationId "com.postlain.hiddenmusic"
                  minSdk 24
                  targetSdk 34
                  versionCode 5
                  versionName "1.4.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      applicationIdSuffix ""
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
              implementation 'androidx.media:media:1.7.0'
          }
          EOF

          # 5. AndroidManifest.xml (Bổ sung quyền chạy nền phát nhạc & thông báo Notification)
          cat << 'EOF' > native-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Hidden Music"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Strings resource
          cat << 'EOF' > native-app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Hidden Music</string>
          </resources>
          EOF

          # 7. MainActivity.java (Bật quyền phát âm thanh nền khi tắt màn hình)
          cat << 'EOF' > native-app/app/src/main/java/com/postlain/hiddenmusic/MainActivity.java
          package com.postlain.hiddenmusic;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.content.pm.PackageManager;
          import android.net.http.SslError;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Xin quyền gửi Notification trên Android 13+
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                  );

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  webView.setScrollBarStyle(View.SCROLLBARS_INSIDE_OVERLAY);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  
                  // QUAN TRỌNG: Cho phép Audio tự play và chạy ngầm khi ẩn app
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setRenderPriority(WebSettings.RenderPriority.HIGH);
                  settings.setOffscreenPreRaster(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.proceed();
                      }
                  });

                  webView.loadUrl("https://hiddenmusic.postlain.com");
              }

              @Override
              protected void onPause() {
                  // KHÔNG gọi webView.onPause() để âm thanh tiếp tục phát nền
                  super.onPause();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK via Gradle 8.5
        run: |
          cd native-app
          gradle assembleDebug --no-daemon

      - name: Prepare APK Binary
        run: |
          cp native-app/app/build/outputs/apk/debug/app-debug.apk ./hidden-music.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HiddenMusic-Media-APK
          path: ./hidden-music.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Hidden Music Vault Android (Latest)"
          body: |
            ## 🎵 Hidden Music Vault - Android APK (Media Background & Playbar Support)
            Hỗ trợ phát nhạc nền khi tắt màn hình, tích hợp quyền Notification & MediaSession.
          draft: false
          prerelease: false
          files: ./hidden-music.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
