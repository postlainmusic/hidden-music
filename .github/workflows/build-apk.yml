name: Build Android APK (Web2APK Engine)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web2apk:
    name: Build via Web2APK Engine
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone Web2APK Engine
        run: |
          git clone https://github.com/77axel/Web2APK.git engine
          cd engine
          npm install || true

      - name: Build APK for Music Vault
        run: |
          cd engine
          # Tạo project wrapper trực tiếp trỏ tới URL
          node index.js --url="https://music.postlain.com" --name="Hidden Music" --package="com.postlain.hiddenmusic" || true

      - name: Prepare APK Binary
        run: |
          find . -name "*.apk" -exec cp {} ./hidden-music.apk \;

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HiddenMusic-Android-APK
          path: ./hidden-music.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Hidden Music Vault Android (Latest)"
          body: |
            ## 🎵 Hidden Music Vault - Android APK
            Ứng dụng Android chạy trực tiếp nền tảng [music.postlain.com](https://music.postlain.com).
          draft: false
          prerelease: false
          files: ./hidden-music.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
